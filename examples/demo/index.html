<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NorKey demo</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
      button, input { font: inherit; padding: 8px 12px; margin: 4px 4px 4px 0; }
      input { width: 100%; box-sizing: border-box; }
      code, pre { font-family: ui-monospace, monospace; word-break: break-all; }
      pre { background: #f3f3f3; padding: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>NorKey demo</h1>
    <button id="connect">Connect</button>
    <p>Address: <code id="address">not connected</code></p>
    <p>Balance: <code id="balance">-</code> <button id="refresh">Refresh</button></p>
    <label>To <input id="to" placeholder="0x..." /></label>
    <label>Amount (ETH) <input id="amount" value="0.0001" /></label>
    <button id="send">Send</button>
    <pre id="log"></pre>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
