# Publishes @norkey/client, @norkey/server and @norkey/vault when a tag vX.Y.Z is pushed.
#
# Founder setup, once, before the first tag:
# - On npmjs.com, open each of the three packages, then Settings, then Trusted Publisher, and add
#   GitHub Actions with repo xanderslabs/norkey, workflow release.yml and environment npm.
# - On GitHub, create the environment npm (repo Settings, then Environments) and require the
#   founder's approval on it. The publish job waits for that approval.
# No npm token is stored. `id-token: write` lets a recent npm mint a short-lived credential from
# GitHub's OIDC, and the same OIDC token carries the provenance attestation. Without the Trusted
# Publishers, the publish step fails with an auth error.
name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref_name }}

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm CLI for OIDC publishing
        run: npm install -g npm@11.11.0

      - run: pnpm install --frozen-lockfile

      # No em-dash, en-dash, ellipsis, arrow or curly quote in prose. The code points are written as
      # \x{...} escapes so this file stays pure ASCII. grep exits 0 on a hit and 1 on no match; any
      # other status is an error, and the step fails closed on it.
      - name: No AI-punctuation tells in prose
        env:
          LC_ALL: C.UTF-8
        run: |
          rc=0
          grep -rnP '[\x{2014}\x{2013}\x{2026}\x{2192}\x{2018}\x{2019}\x{201C}\x{201D}]' packages examples docs scripts README.md --include='*.ts' --include='*.mjs' --include='*.md' --include='*.html' --include='*.css' --include='*.json' || rc=$?
          case "$rc" in
            1) ;;
            0)
              echo "::error::AI-punctuation tells found in the files above. Use plain punctuation."
              exit 1
              ;;
            *)
              echo "::error::the prose check failed to run (grep exited $rc)"
              exit 1
              ;;
          esac

      - name: Tag matches every package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for pkg in client server vault; do
            found=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$found" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match packages/$pkg/package.json version $found"
              exit 1
            fi
          done

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm pack:smoke

      - run: pnpm publish -r --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"
